# Keeps the Instagram block fresh. The site itself is published by Cloudflare
# (it rebuilds automatically after every commit, including the ones made here).
#  - every 6 hours, on every push to main, or by hand: Actions → "Update Instagram" → Run workflow
#  - needs the repository variable BEHOLD_FEED_URL (Settings → Secrets and variables → Actions → Variables).
#    Without it the workflow does nothing and finishes green. See README → Instagram.
name: Update Instagram

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # to commit new posts

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch the 5 latest Instagram posts
        if: ${{ vars.BEHOLD_FEED_URL != '' }}
        env:
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL }}
        run: |
          cd tools
          npm install --no-audit --no-fund --silent
          node fetch-instagram.mjs
      - name: Save new posts to the repository
        run: |
          git add data/instagram.js assets/images/instagram
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Instagram posts"
            git push
          fi
