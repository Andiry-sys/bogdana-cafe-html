  <!-- ============ HEADER ============ -->
  <header class="site-header" id="site-header">
    <div class="container site-header__inner">
      <a href="index.html" data-aria="contacts.fullName"><span class="logo"><svg class="logo__mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#d9a441"/><circle cx="20" cy="20" r="15" fill="#c0341d"/><circle cx="14" cy="15" r="3.4" fill="#fbf6ee"/><circle cx="25.5" cy="23.5" r="3.6" fill="#fbf6ee"/><circle cx="15" cy="26" r="2.6" fill="#fbf6ee"/><path d="M23 10c3.5 0 6 2.3 6.3 5.6-3.4.2-6.1-2-6.3-5.6z" fill="#2f6b3a"/></svg><span class="logo__text"><span class="logo__kind" data-t="contacts.kind"></span><span class="logo__name" data-t="contacts.name"></span></span></span></a>
      <nav class="nav" aria-label="Основна навігація">
        <ul>
          <li><a href="menu.html" aria-current="page" data-t="common.nav.menu"></a></li>
          <li><a href="index.html#zakvaska" data-t="common.nav.sourdough"></a></li>
          <li><a href="index.html#contacts" data-t="common.nav.contacts"></a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="menu.html" class="header-menu-link" aria-current="page" data-t="common.nav.menu"></a>
        <a class="btn btn--primary header-call" data-tel data-track="header" data-aria="common.callButton"><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg><span class="header-call__num" data-phone></span></a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="menu-hero" aria-labelledby="menu-title">
      <div class="container">
        <nav class="breadcrumbs" data-aria="menu.page.breadcrumbsLabel">
          <ol><li><a href="index.html" data-t="common.nav.home"></a></li><li aria-hidden="true">/</li><li aria-current="page" data-t="common.nav.menu"></li></ol>
        </nav>
        <h1 id="menu-title" data-html="menu.page.title"></h1>
        <p data-t="menu.page.intro"></p>
      </div>
      <!-- Category chips (sticky) — one per category in data/menu.js -->
      <nav class="chips" data-aria="menu.page.categoriesLabel">
        <ul class="container" data-list="menu.categories" data-tpl="tpl-chip"></ul>
      </nav>
    </section>

    <!-- One section per category, pizzas inside (all from data/menu.js) -->
    <div data-list="menu.categories" data-tpl="tpl-menu-section"></div>

    <!-- ============ CALL BAND ============ -->
    <section class="callband" aria-labelledby="call-title">
      <div class="callband__box" data-reveal="scale">
        <h2 id="call-title" data-t="home.callBand.title"></h2>
        <p data-t="home.callBand.text"></p>
        <a class="callband__phone" data-tel data-track="call-band"><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg><span data-phone></span></a>
        <p class="callband__status" data-open-status></p>
      </div>
    </section>
    <div class="menu-bottom-space"></div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container site-footer__grid">
      <div>
        <span class="logo logo--invert"><svg class="logo__mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#d9a441"/><circle cx="20" cy="20" r="15" fill="#c0341d"/><circle cx="14" cy="15" r="3.4" fill="#fbf6ee"/><circle cx="25.5" cy="23.5" r="3.6" fill="#fbf6ee"/><circle cx="15" cy="26" r="2.6" fill="#fbf6ee"/><path d="M23 10c3.5 0 6 2.3 6.3 5.6-3.4.2-6.1-2-6.3-5.6z" fill="#2f6b3a"/></svg><span class="logo__text"><span class="logo__kind" data-t="contacts.kind"></span><span class="logo__name" data-t="contacts.name"></span></span></span>
        <p data-t="common.footer.about"></p>
        <ul class="socials socials--light" data-list="contacts.socials" data-tpl="tpl-social"></ul>
      </div>
      <nav aria-label="Навігація у футері">
        <h2 data-t="common.footer.pagesTitle"></h2>
        <ul>
          <li><a href="index.html" data-t="common.footer.links.home"></a></li>
          <li><a href="menu.html" data-t="common.footer.links.menu"></a></li>
          <li><a href="index.html#zakvaska" data-t="common.footer.links.sourdough"></a></li>
          <li><a href="index.html#contacts" data-t="common.footer.links.contacts"></a></li>
        </ul>
      </nav>
      <div>
        <h2 data-t="common.footer.orderTitle"></h2>
        <ul>
          <li><a class="site-footer__phone" data-tel data-phone data-track="footer"></a></li>
          <li class="site-footer__msg"><a data-messenger="viber" data-track="footer" data-aria="common.messengers.viberAria"><span data-t="common.messengers.viber"></span></a> · <a data-messenger="telegram" data-track="footer" data-aria="common.messengers.telegramAria"><span data-t="common.messengers.telegram"></span></a></li>
          <li><span data-t="contacts.address.street"></span>, <span data-t="contacts.address.village"></span>, <span data-t="contacts.address.district"></span>, <span data-t="contacts.address.region"></span></li>
          <li data-t="contacts.hoursShort"></li>
        </ul>
      </div>
    </div>
    <div class="container"><p class="site-footer__bottom">© <span data-year></span> <span data-t="contacts.fullName"></span></p></div>
  </footer>

  <!-- ============ BOTTOM BAR (phones): call button always one tap away ============ -->
  <div class="mobile-bar">
    <div class="mobile-bar__inner">
      <a href="index.html#contacts" class="btn btn--ghost btn--icon" data-aria="common.address"><svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg></a>
      <a class="btn btn--ghost btn--icon btn--viber" data-messenger="viber" data-track="mobile-bar" data-aria="common.messengers.viberAria"><svg class="icon" aria-hidden="true"><use href="#i-viber"></use></svg></a>
      <a class="btn btn--ghost btn--icon btn--telegram" data-messenger="telegram" data-track="mobile-bar" data-aria="common.messengers.telegramAria"><svg class="icon" aria-hidden="true"><use href="#i-telegram"></use></svg></a>
      <a class="btn btn--primary" data-tel data-track="mobile-bar"><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg><span data-t="common.callShort"></span></a>
    </div>
  </div>

  <!-- ============ TEMPLATES (filled by assets/js/render.js) ============ -->
  <template id="tpl-chip"><li><a class="chip" data-cat-chip><span data-f="title"></span> <small data-cat-count></small></a></li></template>
  <template id="tpl-menu-section">
    <section class="menu-section" data-cat-section>
      <div class="container">
        <div class="menu-section__head">
          <h2 data-cat-title></h2>
          <p data-f="subtitle"></p>
        </div>
        <ul class="menu-grid" data-pizzas-category></ul>
      </div>
    </section>
  </template>
  <template id="tpl-social">
    <li><a class="social" target="_blank" rel="noopener" data-f-href="url" data-f-aria="label"><svg class="icon" aria-hidden="true"><use data-f-icon="icon"></use></svg></a></li>
  </template>
  <!-- One pizza = card + popup. Filled from data/menu.js -->
  <template id="tpl-pizza">
    <li data-reveal>
      <article data-pizza-article>
        <button type="button" class="pcard" aria-haspopup="dialog">
          <span class="pcard__media">
            <img data-pizza-img alt="" width="800" height="600" loading="lazy" decoding="async">
            <span class="pcard__tags" data-pizza-tags></span>
          </span>
          <span class="pcard__body">
            <span class="pcard__head">
              <span class="pcard__name" data-f="name"></span>
              <span class="pcard__it" lang="it" data-f="nameIt"></span>
            </span>
            <span class="pcard__short" data-f="short"></span>
            <span class="pcard__more"><span data-t="common.pizza.more"></span> <svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg></span>
          </span>
        </button>
        <dialog class="pdialog">
          <!-- ‹ › previous / next pizza (also ← → keys and swipe) -->
          <button type="button" class="pdialog__nav pdialog__nav--prev" data-pizza-nav="-1" data-aria="common.pizza.prev"><svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg></button>
          <button type="button" class="pdialog__nav pdialog__nav--next" data-pizza-nav="1" data-aria="common.pizza.next"><svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg></button>
          <div class="pdialog__sheet">
            <button type="button" class="pdialog__close" data-close data-aria="common.close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
            <div class="pdialog__media"><img data-pizza-img="popup" alt="" width="800" height="600" loading="lazy" decoding="async"></div>
            <div class="pdialog__body">
              <p class="pdialog__it" lang="it" data-f="nameIt"></p>
              <h3 class="pdialog__title" data-f="name"></h3>
              <p class="pdialog__tags" data-pizza-tags></p>
              <h4 class="pdialog__label" data-t="common.pizza.ingredientsTitle"></h4>
              <ul class="ingredients" data-pizza-ingredients>
                <li class="is-dough" data-t="common.pizza.dough"></li>
              </ul>
              <div class="pdialog__cta">
                <a class="btn btn--primary btn--block" data-tel data-pizza-track><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg><span data-t="common.callAndOrder"></span></a>
                <div class="msg-btns msg-btns--grid"><a class="btn btn--msg btn--viber" data-messenger="viber" data-pizza-track data-track="pizza" data-aria="common.messengers.viberAria"><svg class="icon" aria-hidden="true"><use href="#i-viber"></use></svg><span data-t="common.messengers.viber"></span></a><a class="btn btn--msg btn--telegram" data-messenger="telegram" data-pizza-track data-track="pizza" data-aria="common.messengers.telegramAria"><svg class="icon" aria-hidden="true"><use href="#i-telegram"></use></svg><span data-t="common.messengers.telegram"></span></a></div>
              </div>
            </div>
          </div>
        </dialog>
      </article>
    </li>
  </template>

  <!-- ============ TEXTS (edit files in /data) → render → behaviour ============ -->
  <script src="data/analytics.js"></script>
  <script src="data/contacts.js"></script>
  <script src="data/common.js"></script>
  <script src="data/home.js"></script>
  <script src="data/menu.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
